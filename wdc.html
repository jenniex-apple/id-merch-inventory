<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>I&D Merch Inventory — Tableau Connector</title>
<script src="https://connectors.tableau.com/libs/tableauwdc-2.3.latest.js" type="text/javascript"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{background:#fff;border-radius:18px;padding:36px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;}
  h1{font-size:20px;font-weight:700;margin-bottom:8px;}
  p{font-size:14px;color:#6e6e73;margin-bottom:24px;line-height:1.5;}
  button{background:#0071e3;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;}
  button:hover{background:#0077ed;}
  .status{font-size:12px;color:#6e6e73;margin-top:14px;}
</style>
</head>
<body>
<div class="box">
  <h1>📦 I&D Merch Inventory</h1>
  <p>Tableau Web Data Connector<br/>Click below to connect and pull live inventory data into Tableau.</p>
  <button onclick="connect()">Connect to Tableau</button>
  <div class="status" id="status"></div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/jenniex-apple/id-merch-inventory/main/inventory-data.json';

var connector = tableau.makeConnector();

connector.getSchema = function(schemaCallback) {
  var cols = [
    {id:'channel',    alias:'Channel',           dataType:tableau.dataTypeEnum.string},
    {id:'id',         alias:'ID',                dataType:tableau.dataTypeEnum.int},
    {id:'name',       alias:'Item Name',         dataType:tableau.dataTypeEnum.string},
    {id:'category',   alias:'Category',          dataType:tableau.dataTypeEnum.string},
    {id:'qty',        alias:'Current Balance',   dataType:tableau.dataTypeEnum.int},
    {id:'totalQty',   alias:'Total Qty',         dataType:tableau.dataTypeEnum.int},
    {id:'requested',  alias:'Qty Requested',     dataType:tableau.dataTypeEnum.int},
    {id:'threshold',  alias:'Low Stock Threshold',dataType:tableau.dataTypeEnum.int},
    {id:'unitCost',   alias:'Unit Cost',         dataType:tableau.dataTypeEnum.float},
    {id:'status',     alias:'Status',            dataType:tableau.dataTypeEnum.string},
    {id:'loc4th',     alias:'CC1 4th Floor',     dataType:tableau.dataTypeEnum.string},
    {id:'loc3rd',     alias:'CC1 3rd Floor',     dataType:tableau.dataTypeEnum.string},
    {id:'mead',       alias:'Mead',              dataType:tableau.dataTypeEnum.string},
    {id:'notes',      alias:'Notes',             dataType:tableau.dataTypeEnum.string},
    {id:'origin',     alias:'Country of Origin', dataType:tableau.dataTypeEnum.string},
  ];
  schemaCallback([{id:'id_merch_inventory', alias:'I&D Merch Inventory', columns:cols}]);
};

connector.getData = function(table, doneCallback) {
  fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      var rows = (data.inv || data).map(function(i) {
        var q = Math.max(0, i.qty);
        var status = q === 0 ? 'Out of Stock' : q <= i.threshold ? 'Low Stock' : 'In Stock';
        return {
          channel:   i.channel  || 'I&D',
          id:        i.id,
          name:      i.name,
          category:  i.category,
          qty:       q,
          totalQty:  i.totalQty || 0,
          requested: i.requested || 0,
          threshold: i.threshold || 0,
          unitCost:  i.unitCost || 0,
          status:    status,
          loc4th:    i.loc4th || '',
          loc3rd:    i.loc3rd || '',
          mead:      i.mead   || '',
          notes:     i.notes  || '',
          origin:    i.origin || '',
        };
      });
      table.appendRows(rows);
      doneCallback();
    })
    .catch(function(e) {
      tableau.abortWithError('Could not load inventory data: ' + e.message);
    });
};

tableau.registerConnector(connector);

function connect() {
  document.getElementById('status').textContent = 'Connecting…';
  tableau.connectionName = 'I&D Merch Inventory';
  tableau.submit();
}
</script>
</body>
</html>
