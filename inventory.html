<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>I&D Merch Inventory</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--accent:#0071e3;--accent-h:#0077ed;--danger:#ff3b30;--warning:#ff9500;--success:#34c759;--purple:#af52de;--text:#1d1d1f;--sub:#6e6e73;--border:#d2d2d7;--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.07);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:62px;}
  .header-left{display:flex;align-items:center;gap:12px;}
  header h1{font-size:18px;font-weight:700;letter-spacing:-.4px;}
  .header-tag{background:#f0e6ff;color:var(--purple);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .last-upd{font-size:12px;color:var(--sub);}
  main{max-width:1160px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:24px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
  .stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:4px;}
  .stat .lbl{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;}
  .stat .val{font-size:30px;font-weight:700;letter-spacing:-1px;}
  .stat.s-ok .val{color:var(--success);} .stat.s-low .val{color:var(--warning);} .stat.s-out .val{color:var(--danger);} .stat.s-cost .val{font-size:22px;}
  .stat.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .stat.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.12);}
  .stat.clickable .hint{font-size:11px;color:var(--sub);margin-top:3px;opacity:0;transition:opacity .15s;}
  .stat.clickable:hover .hint{opacity:1;}
  .stat.active{outline:2px solid;outline-offset:-2px;}
  .stat.s-ok.active{outline-color:var(--success);background:#f2fdf5;} .stat.s-low.active{outline-color:var(--warning);background:#fffbf0;} .stat.s-out.active{outline-color:var(--danger);background:#fff5f5;}
  .stat.active .hint{opacity:1;font-weight:600;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .card-hd{padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .card-hd h2{font-size:16px;font-weight:600;}
  .card-bd{padding:16px 22px 22px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap input{width:100%;padding-left:34px;}
  .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;pointer-events:none;}
  select,input{padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border .2s,box-shadow .2s;}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.13);}
  .tbl-wrap{overflow-x:auto;margin-top:14px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr{transition:background .12s;} tbody tr:hover{background:#f7f7fa;}
  tbody td{padding:11px 12px;border-bottom:1px solid #f0f0f3;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .item-name{font-weight:500;line-height:1.3;} .item-note{font-size:11px;color:var(--sub);margin-top:2px;font-style:italic;}
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .b-ok{background:#d1f2db;color:#1a7a34;} .b-low{background:#fff3cd;color:#7a5500;} .b-out{background:#ffd7d5;color:#8a1a14;} .b-chorus{background:#ede6ff;color:#6424a8;margin-left:4px;}
  .bar-wrap{display:flex;align-items:center;gap:8px;}
  .bar-bg{flex:1;height:5px;background:#e5e5ea;border-radius:3px;overflow:hidden;min-width:50px;}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s;}
  .bar-pct{font-size:11px;color:var(--sub);min-width:30px;text-align:right;}
  .locs{display:flex;gap:4px;flex-wrap:wrap;}
  .loc-pill{font-size:11px;background:#f0f0f5;color:var(--sub);padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .loc-pill span{color:var(--text);font-weight:600;}
  .qty-info{display:flex;flex-direction:column;gap:1px;}
  .qty-bal{font-size:15px;font-weight:700;} .qty-meta{font-size:11px;color:var(--sub);}
  .btn{padding:9px 18px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,113,227,.3);}
  .btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);} .btn-secondary:hover{background:var(--border);}
  .btn-sm{padding:5px 12px;font-size:12px;border-radius:8px;}
  .btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd5d3;} .btn-danger:hover{background:#ffd5d3;}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fg{display:flex;flex-direction:column;gap:5px;} .fg.full{grid-column:1/-1;}
  label{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;}
  textarea{padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--bg);resize:vertical;min-height:64px;color:var(--text);outline:none;}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.13);}
  .log-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f3;font-size:13px;}
  .log-item:last-child{border-bottom:none;}
  .log-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .ld-deduct{background:var(--danger);} .ld-add{background:var(--success);} .ld-remove{background:var(--warning);}
  .log-time{font-size:11px;color:var(--sub);margin-top:2px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-bg.open{opacity:1;pointer-events:all;}
  .modal{background:var(--card);border-radius:18px;padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:scale(.95);transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .modal-bg.open .modal{transform:scale(1);}
  .modal h3{font-size:17px;font-weight:600;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:#1d1d1f;color:#fff;padding:12px 22px;border-radius:20px;font-size:13px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;z-index:999;white-space:nowrap;}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .alert-bar{background:#fff8e6;border:1px solid #ffe5a0;border-radius:var(--radius);padding:14px 18px;display:flex;align-items:flex-start;gap:10px;font-size:13px;}
  .alert-bar.hidden{display:none;}
  .alert-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
  .alert-bar ul{margin:6px 0 0 16px;display:flex;flex-direction:column;gap:3px;}
  /* Inline qty edit */
  .qty-edit{display:none;width:70px;font-size:14px;padding:4px 8px;border-radius:8px;text-align:center;}
  .qty-bal{font-size:15px;font-weight:700;cursor:pointer;border-bottom:2px dashed var(--border);transition:border-color .15s;}
  .qty-bal:hover{border-color:var(--accent);}
  /* Category groups */
  .cat-group{margin-top:10px;}
  .cat-toggle{width:100%;background:var(--bg);border:none;border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);transition:background .15s;}
  .cat-toggle:hover{background:#ebebef;}
  .cat-toggle .cat-arrow{font-size:11px;color:var(--sub);transition:transform .2s;}
  .cat-toggle.open .cat-arrow{transform:rotate(90deg);}
  .cat-toggle .cat-meta{font-size:11px;color:var(--sub);font-weight:400;margin-left:8px;}
  .cat-body{display:none;} .cat-body.open{display:table-row-group;}
  @media(max-width:650px){.form-grid{grid-template-columns:1fr;}.stats{grid-template-columns:1fr 1fr;}main{padding:16px 14px;}header{padding:0 16px;}.bar-wrap,.locs{display:none;}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>&#x1F4E6; I&amp;D Merch Inventory</h1>
    <span class="header-tag">Inclusion &amp; Diversity</span>
  </div>
  <div class="header-right">
    <span class="last-upd" id="last-upd">&#x2014;</span>
    <button class="btn btn-secondary btn-sm" onclick="exportCSV()">&#x2B07; Export CSV</button>
    <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Item</button>
  </div>
</header>

<main>
  <div class="alert-bar hidden" id="alert-bar">
    <span class="alert-icon">&#x26A0;&#xFE0F;</span>
    <div><strong>Low Stock Alert</strong><ul id="alert-list"></ul></div>
  </div>

  <div class="stats" id="stats-row"></div>

  <div class="card">
    <div class="card-hd">
      <h2>I&amp;D Merchandise</h2>
      <div class="btn-group">
        <select id="filter-cat" onchange="renderTable()" style="font-size:13px;padding:7px 10px;"><option value="">All Categories</option></select>
        <select id="filter-status" onchange="renderTable()" style="font-size:13px;padding:7px 10px;">
          <option value="">All Statuses</option>
          <option value="ok">In Stock</option>
          <option value="low">Low Stock</option>
          <option value="out">Out of Stock</option>
        </select>
        <select id="filter-loc" onchange="renderTable()" style="font-size:13px;padding:7px 10px;">
          <option value="">All Locations</option>
          <option value="4f">CC1 4th Floor</option>
          <option value="3f">CC1 3rd Floor</option>
          <option value="mead">Mead</option>
        </select>
      </div>
    </div>
    <div class="card-bd">
      <input type="checkbox" id="chorus-only" onchange="renderTable()" style="display:none;"/>
      <div class="toolbar">
        <div class="search-wrap">
          <span class="si">&#x1F50D;</span>
          <input type="text" id="search" placeholder="Search by name, category, location&#x2026;" oninput="renderTable()"/>
        </div>
      </div>
      <div class="tbl-wrap">
        <div id="inv-body"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2>&#x1F64B; Request Items</h2></div>
    <div class="card-bd">
      <div class="form-grid">
        <div class="fg"><label>Your Name</label><input type="text" id="req-name" placeholder="e.g. Alex Johnson"/></div>
        <div class="fg"><label>Apple Email</label><input type="email" id="req-email" placeholder="e.g. alexjohnson@apple.com"/></div>
        <div class="fg"><label>Item</label><select id="req-item" onchange="updateMaxQty()"></select></div>
        <div class="fg"><label>Quantity Needed</label><input type="number" id="req-qty" min="1" value="1"/></div>
        <div class="fg"><label>Project / Reason</label><input type="text" id="req-reason" placeholder="e.g. New hire onboarding Q3"/></div>
        <div class="fg full"><button class="btn btn-primary" style="width:fit-content;" onclick="submitRequest()">Submit Request &#x2192; Auto-Deduct</button></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2>&#x1F4CB; Activity Log</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <span id="log-count" style="font-size:12px;color:var(--sub);"></span>
        <button class="btn btn-danger btn-sm" onclick="clearLog()">Clear All</button>
      </div>
    </div>
    <div class="card-bd"><div id="log-list"><p class="empty">No activity yet.</p></div></div>
  </div>
</main>

<div class="modal-bg" id="modal-bg" onclick="bgClose(event)">
  <div class="modal">
    <h3>Add New Item</h3>
    <div class="form-grid">
      <div class="fg full"><label>Item Name</label><input type="text" id="n-name" placeholder="e.g. Pride Tote Bag"/></div>
      <div class="fg"><label>Category</label><select id="n-cat"><option>Apparel</option><option>Accessories</option><option>Bags</option><option>Drinkware</option><option>Kits</option><option>Stationery</option><option>Other</option></select></div>
      <div class="fg"><label>Quantity</label><input type="number" id="n-qty" min="0" value="10"/></div>
      <div class="fg"><label>Low Stock Threshold</label><input type="number" id="n-thresh" min="0" value="5"/></div>
      <div class="fg"><label>Unit Cost ($)</label><input type="number" id="n-cost" min="0" step="0.01" placeholder="optional"/></div>
      <div class="fg"><label>4th Floor Location</label><input type="text" id="n-loc4" placeholder="e.g. 12"/></div>
      <div class="fg"><label>3rd Floor Location</label><input type="text" id="n-loc3" placeholder="e.g. 0"/></div>
      <div class="fg"><label>Mead Location</label><input type="text" id="n-mead" placeholder="e.g. 44"/></div>
      <div class="fg"><label>Country of Origin</label><input type="text" id="n-origin" placeholder="e.g. USA, China, Vietnam"/></div>
      <div class="fg full"><label>Notes</label><textarea id="n-notes" placeholder="Optional notes&#x2026;"></textarea></div>
      <div class="fg" style="flex-direction:row;align-items:center;gap:8px;">
        <input type="checkbox" id="n-chorus" style="width:auto;padding:0;background:none;border:none;"/>
        <label style="text-transform:none;letter-spacing:0;color:var(--text);font-size:13px;cursor:pointer;">On Chorus page</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addItem()">Add Item</button>
    </div>
  </div>
</div>

<div id="toast"></div>

function load()   { const r=localStorage.getItem(SK); return r?JSON.parse(r):JSON.parse(JSON.stringify(SEED)); }
function loadLog(){ const r=localStorage.getItem(LK); return r?JSON.parse(r):[]; }
function save(d)  { inv=d; localStorage.setItem(SK,JSON.stringify(d)); }
function saveLog(l){ log=l; localStorage.setItem(LK,JSON.stringify(l)); }

let inv  = load();
let log  = loadLog();
let nxId = Math.max(0,...inv.map(i=>i.id))+1;

function statusOf(i){const q=Math.max(0,i.qty);if(q===0)return{label:'Out of Stock',cls:'b-out',key:'out'};if(q<=i.threshold)return{label:'Low Stock',cls:'b-low',key:'low'};return{label:'In Stock',cls:'b-ok',key:'ok'};}
function fmtCost(c){return c!=null?'$'+c.toFixed(2):'—';}
function locStr(item){const p=[];if(item.loc4th&&item.loc4th!=='0'&&item.loc4th!=='')p.push({lbl:'4F',val:item.loc4th});if(item.loc3rd&&item.loc3rd!=='0'&&item.loc3rd!=='')p.push({lbl:'3F',val:item.loc3rd});if(item.mead&&item.mead!=='0'&&item.mead!=='')p.push({lbl:'Mead',val:item.mead});return p;}

function renderStats(){
  const ok=inv.filter(i=>statusOf(i).key==='ok').length;
  const low=inv.filter(i=>statusOf(i).key==='low').length;
  const out=inv.filter(i=>statusOf(i).key==='out').length;
  const tot=inv.reduce((a,i)=>a+Math.max(0,i.qty),0);
  const cost=inv.reduce((a,i)=>a+(i.unitCost&&i.qty>0?i.unitCost*Math.max(0,i.qty):0),0);
  const cur=document.getElementById('filter-status').value;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat s-ok clickable${cur==='ok'?' active':''}" onclick="filterByStatus('ok')"><div class="lbl">In Stock</div><div class="val">${ok}</div><div class="hint">${cur==='ok'?'Click to clear':'Click to filter ↓'}</div></div>
    <div class="stat s-low clickable${cur==='low'?' active':''}" onclick="filterByStatus('low')"><div class="lbl">Low Stock</div><div class="val">${low}</div><div class="hint">${cur==='low'?'Click to clear':'Click to filter ↓'}</div></div>
    <div class="stat s-out clickable${cur==='out'?' active':''}" onclick="filterByStatus('out')"><div class="lbl">Out of Stock</div><div class="val">${out}</div><div class="hint">${cur==='out'?'Click to clear':'Click to filter ↓'}</div></div>
    <div class="stat"><div class="lbl">Total Items</div><div class="val">${inv.length}</div></div>
    <div class="stat s-cost"><div class="lbl">Total Units</div><div class="val">${tot.toLocaleString()}</div></div>
    <div class="stat s-cost"><div class="lbl">Est. Value</div><div class="val">$${cost.toLocaleString('en',{maximumFractionDigits:0})}</div></div>`;
}

function filterByStatus(key){const sel=document.getElementById('filter-status');sel.value=sel.value===key?'':key;renderTable();renderStats();if(sel.value)document.getElementById('inv-body').closest('.card').scrollIntoView({behavior:'smooth',block:'start'});}

function renderAlerts(){
  const alerts=inv.filter(i=>statusOf(i).key==='low'||statusOf(i).key==='out');
  const bar=document.getElementById('alert-bar');
  if(!alerts.length){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  document.getElementById('alert-list').innerHTML=alerts.slice(0,8).map(i=>`<li><strong>${i.name}</strong> — ${statusOf(i).label} (${Math.max(0,i.qty)} left)</li>`).join('');
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.getElementById('filter-cat').value;
  const status=document.getElementById('filter-status').value;
  const chorus=document.getElementById('chorus-only').checked;
  const loc=document.getElementById('filter-loc').value;
  const cats=[...new Set(inv.map(i=>i.category))].sort();
  const prevCat=document.getElementById('filter-cat').value;
  document.getElementById('filter-cat').innerHTML='<option value="">All Categories</option>'+cats.map(c=>`<option value="${c}"${c===prevCat?' selected':''}>${c}</option>`).join('');

  const filtered=inv.filter(i=>{
    const st=statusOf(i);
    const locMatch=(!loc)||(loc==='4f'&&i.loc4th&&i.loc4th!=='0'&&i.loc4th!=='')||(loc==='3f'&&i.loc3rd&&i.loc3rd!=='0'&&i.loc3rd!=='')||(loc==='mead'&&i.mead&&i.mead!=='0'&&i.mead!=='');
    const searchStr=[i.name,i.category,i.notes,i.loc4th,i.loc3rd,i.mead].join(' ').toLowerCase();
    return(!q||searchStr.includes(q))&&(!cat||i.category===cat)&&(!status||st.key===status)&&(!chorus||i.onChorus)&&locMatch;
  });

  const maxQ=Math.max(1,...inv.map(i=>Math.max(0,i.qty)));
  const container=document.getElementById('inv-body');

  if(!filtered.length){
    container.innerHTML='<p style="text-align:center;padding:36px;color:var(--sub);font-size:13px;">No items match.</p>';
    return;
  }

  // Group by category
  const groups={};
  filtered.forEach(item=>{
    if(!groups[item.category]) groups[item.category]=[];
    groups[item.category].push(item);
  });

  // Preserve open/closed state
  const openCats=new Set();
  container.querySelectorAll('.cat-toggle.open').forEach(el=>openCats.add(el.dataset.cat));
  // All categories start collapsed on first render
  const firstRender=false;

  container.innerHTML=Object.keys(groups).sort().map(catName=>{
    const items=groups[catName];
    const isOpen=firstRender||openCats.has(catName);
    const lowCount=items.filter(i=>statusOf(i).key==='low').length;
    const outCount=items.filter(i=>statusOf(i).key==='out').length;
    const badges=(outCount?`<span style="background:#ffd7d5;color:#8a1a14;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:6px;">${outCount} out</span>`:'')+
                 (lowCount?`<span style="background:#fff3cd;color:#7a5500;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:4px;">${lowCount} low</span>`:'');
    const rows=items.map(item=>{
      const st=statusOf(item);const q=Math.max(0,item.qty);const pct=Math.round(q/maxQ*100);
      const color=st.key==='ok'?'#34c759':st.key==='low'?'#ff9500':'#ff3b30';
      const locs=locStr(item);
      const locHTML=locs.length?`<div class="locs">${locs.map(l=>`<span class="loc-pill">${l.lbl} <span>${l.val}</span></span>`).join('')}</div>`:'<span style="font-size:12px;color:var(--sub)">—</span>';
      return `<tr>
        <td><div class="item-name">${item.name}${item.onChorus?'<span class="badge b-chorus" style="font-size:10px;">Chorus</span>':''}</div>${item.notes?`<div class="item-note">${item.notes}</div>`:''}</td>
        <td><span style="font-size:12px;color:var(--sub)">${item.category}</span></td>
        <td>
          <div class="qty-info">
            <span class="qty-bal" title="Click to edit" onclick="startQtyEdit(${item.id},this)">${q}</span>
            <input class="qty-edit" id="qe-${item.id}" type="number" min="0" value="${q}" onblur="saveQtyEdit(${item.id})" onkeydown="if(event.key==='Enter')saveQtyEdit(${item.id});if(event.key==='Escape')cancelQtyEdit(${item.id})"/>
            <span class="qty-meta">of ${item.totalQty} · ${item.requested} req.</span>
          </div>
        </td>
        <td><span class="badge ${st.cls}">${st.label}</span></td>
        <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="bar-pct">${pct}%</span></div></td>
        <td>${locHTML}</td>
        <td style="font-size:13px;white-space:nowrap">${fmtCost(item.unitCost)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="delItem(${item.id})">Remove</button></td>
      </tr>`;
    }).join('');

    return `<div class="cat-group">
      <button class="cat-toggle${isOpen?' open':''}" data-cat="${catName}" onclick="toggleCat(this)">
        <span>▶ <span class="cat-arrow"></span> ${catName} <span class="cat-meta">${items.length} item${items.length!==1?'s':''}</span>${badges}</span>
        <span style="font-size:12px;color:var(--sub)">${isOpen?'▲ collapse':'▼ expand'}</span>
      </button>
      <table class="${isOpen?'cat-body open':'cat-body'}" style="width:100%;border-collapse:collapse;font-size:13.5px;">
        <thead><tr>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Item</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Category</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Balance</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Status</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Stock Level</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Locations</th>
          <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);">Unit Cost</th>
          <th style="border-bottom:1px solid var(--border);"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function toggleCat(btn){
  btn.classList.toggle('open');
  const table=btn.nextElementSibling;
  table.classList.toggle('open');
  btn.lastElementChild.textContent=btn.classList.contains('open')?'▲ collapse':'▼ expand';
}

function startQtyEdit(id,el){
  el.style.display='none';
  const inp=document.getElementById('qe-'+id);
  inp.style.display='inline-block';inp.focus();inp.select();
}
function saveQtyEdit(id){
  const inp=document.getElementById('qe-'+id);
  const newQty=parseInt(inp.value);
  if(isNaN(newQty)||newQty<0){cancelQtyEdit(id);return;}
  const item=inv.find(i=>i.id===id);
  if(!item){cancelQtyEdit(id);return;}
  const old=item.qty;
  item.qty=newQty;
  if(newQty>old) item.totalQty=Math.max(item.totalQty,newQty);
  save(inv);
  log.push({type:'add',msg:`Updated <strong>${item.name}</strong> qty: ${old} → ${newQty}`,time:new Date().toLocaleString()});
  saveLog(log);
  toast(`✅ ${item.name} updated to ${newQty}`);
  renderAll();
}
function cancelQtyEdit(id){
  const item=inv.find(i=>i.id===id);if(!item)return;
  const inp=document.getElementById('qe-'+id);
  inp.style.display='none';
  inp.previousElementSibling.style.display='';
}

function renderReqDropdown(){
  const avail=inv.filter(i=>i.qty>0).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('req-item').innerHTML=avail.length?avail.map(i=>`<option value="${i.id}">${i.name} (${i.qty} avail.)</option>`).join(''):'<option value="">No items in stock</option>';
  updateMaxQty();
}
function updateMaxQty(){const id=parseInt(document.getElementById('req-item').value);const item=inv.find(i=>i.id===id);if(item)document.getElementById('req-qty').max=item.qty;}

function renderLog(){
  const el=document.getElementById('log-list');
  document.getElementById('log-count').textContent=log.length?`${log.length} entries`:'';
  if(!log.length){el.innerHTML='<p class="empty">No activity yet.</p>';return;}
  el.innerHTML=[...log].map((e,i)=>({...e,_i:i})).reverse().slice(0,50).map(e=>`
    <div class="log-item">
      <div class="log-dot ld-${e.type}"></div>
      <div style="flex:1"><div>${e.msg}</div><div class="log-time">${e.time}</div></div>
      <button class="btn btn-danger btn-sm" style="padding:3px 9px;font-size:11px;" onclick="deleteLogEntry(${e._i})">Delete</button>
    </div>`).join('');
}

function deleteLogEntry(i){
  const entry=log[i];
  if(entry.type==='deduct'&&entry.itemId&&entry.qty){
    const item=inv.find(x=>x.id===entry.itemId);
    if(item){
      item.qty+=entry.qty;
      item.requested=Math.max(0,item.requested-entry.qty);
      save(inv);
      toast(`↩️ ${entry.qty} returned to inventory.`);
    }
  }
  log.splice(i,1);
  saveLog(log);
  renderAll();
}

function clearLog(){
  if(!log.length)return;
  if(!confirm('Clear entire activity log?'))return;
  log=[];saveLog(log);renderLog();
  document.getElementById('log-count').textContent='';
  toast('🗑 Activity log cleared.');
}

function renderAll(){renderStats();renderAlerts();renderTable();renderReqDropdown();renderLog();document.getElementById('last-upd').textContent='Updated '+new Date().toLocaleTimeString();}

function submitRequest(){
  const name=document.getElementById('req-name').value.trim();
  const email=document.getElementById('req-email').value.trim();
  const itemId=parseInt(document.getElementById('req-item').value);
  const qty=parseInt(document.getElementById('req-qty').value);
  const reason=document.getElementById('req-reason').value.trim();
  if(!name){toast('⚠️ Please enter your name.');return;}
  if(!email){toast('⚠️ Please enter your Apple email.');return;}
  if(!email.endsWith('@apple.com')){toast('⚠️ Please use your @apple.com email address.');return;}
  if(!itemId){toast('⚠️ Please select an item.');return;}
  if(!qty||qty<1){toast('⚠️ Quantity must be at least 1.');return;}
  const item=inv.find(i=>i.id===itemId);
  if(!item){toast('⚠️ Item not found.');return;}
  if(qty>item.qty){toast(`⚠️ Only ${item.qty} available.`);return;}
  item.qty-=qty;item.requested+=qty;
  save(inv);
  log.push({type:'deduct',itemId,qty,msg:`${name} (${email}) requested ${qty}× <strong>${item.name}</strong>${reason?' — '+reason:''}`,time:new Date().toLocaleString()});
  saveLog(log);
  document.getElementById('req-name').value='';document.getElementById('req-email').value='';document.getElementById('req-qty').value='1';document.getElementById('req-reason').value='';
  toast(`✅ ${qty}× ${item.name} deducted. Balance: ${item.qty}`);renderAll();
}

function delItem(id){
  const item=inv.find(i=>i.id===id);if(!item)return;
  if(!confirm(`Remove "${item.name}"?`))return;
  inv=inv.filter(i=>i.id!==id);save(inv);
  log.push({type:'remove',msg:`Removed: <strong>${item.name}</strong>`,time:new Date().toLocaleString()});saveLog(log);
  toast(`🗑 "${item.name}" removed.`);renderAll();
}

function openModal(){document.getElementById('modal-bg').classList.add('open');document.getElementById('n-name').focus();}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function bgClose(e){if(e.target===document.getElementById('modal-bg'))closeModal();}

function addItem(){
  const name=document.getElementById('n-name').value.trim();
  const cat=document.getElementById('n-cat').value;
  const qty=parseInt(document.getElementById('n-qty').value)||0;
  const thresh=parseInt(document.getElementById('n-thresh').value)||5;
  const cost=parseFloat(document.getElementById('n-cost').value)||null;
  const loc4=document.getElementById('n-loc4').value.trim();
  const loc3=document.getElementById('n-loc3').value.trim();
  const mead=document.getElementById('n-mead').value.trim();
  const origin=document.getElementById('n-origin').value.trim();
  const notes=document.getElementById('n-notes').value.trim();
  const chorus=document.getElementById('n-chorus').checked;
  if(!name){toast('⚠️ Item name required.');return;}
  const item={id:nxId++,name,category:cat,qty,totalQty:qty,requested:0,threshold:thresh,unitCost:cost,notes,loc4th:loc4,loc3rd:loc3,mead,origin,onChorus:chorus};
  inv.push(item);save(inv);
  log.push({type:'add',msg:`Added ${qty}× <strong>${name}</strong>`,time:new Date().toLocaleString()});saveLog(log);
  closeModal();toast(`✅ "${name}" added!`);renderAll();
}

function exportCSV(){
  const rows=[['Item','Category','Balance','Total Qty','Qty Requested','Status','Unit Cost','4th Floor','3rd Floor','Mead','On Chorus','Notes']];
  inv.forEach(i=>rows.push([i.name,i.category,Math.max(0,i.qty),i.totalQty,i.requested,statusOf(i).label,i.unitCost??'',i.loc4th,i.loc3rd,i.mead,i.onChorus?'Yes':'No',i.notes]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'ID-Merch-Inventory.csv'});
  a.click();toast('📥 Exported!');
}

let tt;
function toast(msg){const el=document.getElementById('toast');el.innerHTML=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3400);}

renderAll();
</script>
</body>
</html>
